name: fork sync

# Weekly upstream sync of each line into its integration branch, gated on tests passing (not on the absence
# of conflicts). The repair agent runs only when a step conflicts in an allowed path. Nothing here writes a
# port or device branch; see .github/fork-sync/README.md.
#
# Two lines share this repo (see .github/fork-sync/config.sh). The tools always come from the default
# branch (`port`), so `sp-port` holds nothing but sunnypilot's opendbc plus the angle port.

on:
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC (Sunday night, US time)
  workflow_dispatch:
    inputs:
      force:
        description: Run even if upstream has not moved since the last run
        type: boolean
        default: false
      line:
        description: Which line to run
        type: choice
        options: [all, comma, sp]
        default: all

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    if: github.repository == 'angelo-hub/opendbc'
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: comma
            port: port
          - line: sp
            port: sp-port
    concurrency:
      group: fork-sync-${{ matrix.line }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}  # gh would otherwise target the parent repo (commaai)
      FORCE: ${{ inputs.force || false }}
      FORK_SYNC_LINE: ${{ matrix.line }}
      SELECTED: ${{ inputs.line == '' || inputs.line == 'all' || inputs.line == matrix.line }}
    steps:
      - uses: actions/checkout@v7
        if: env.SELECTED == 'true'
        with:
          ref: ${{ matrix.port }}
          fetch-depth: 0

      - uses: actions/checkout@v7
        if: env.SELECTED == 'true'
        with:
          ref: port
          path: .fork-sync-tools
          sparse-checkout: .github/fork-sync

      - name: tools and git identity
        if: env.SELECTED == 'true'
        run: |
          mv .fork-sync-tools/.github/fork-sync "$RUNNER_TEMP/fork-sync-tools"
          rm -rf .fork-sync-tools
          echo "TOOLS=$RUNNER_TEMP/fork-sync-tools" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: detect
        name: 1. fetch upstream
        if: env.SELECTED == 'true'
        run: $TOOLS/detect.sh

      - id: merge
        name: 2-4. merge upstream and triage conflicts
        if: steps.detect.outputs.DECISION == 'run'
        run: $TOOLS/merge.sh

      - id: prompt
        if: steps.merge.outputs.RESULT == 'conflict'
        run: $TOOLS/render_prompt.sh

      - id: agent
        name: repair agent
        if: steps.merge.outputs.RESULT == 'conflict'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.PROMPT }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git ls-files:*),Bash(git merge-base:*),Bash(git blame:*),Bash(${{ runner.temp }}/fork-sync-tools/agent_test.sh:*)"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(git checkout:*),Bash(git reset:*),Bash(git restore:*),Bash(git merge:*),Bash(git read-tree:*),Bash(git add:*),Bash(git rebase:*),WebFetch,WebSearch"

      - id: verify
        name: check the agent's resolution
        if: steps.merge.outputs.RESULT == 'conflict' && steps.agent.outcome == 'success'
        run: $TOOLS/verify.sh

      - id: resume
        name: apply remaining upstream specs
        if: steps.verify.outputs.VERIFY == 'ok'
        run: $TOOLS/merge.sh continue

      - id: gate
        name: gate (safety suite, tests, car behavior report)
        continue-on-error: true  # a crashed gate is reported as red by publish
        if: steps.merge.outputs.RESULT == 'clean' || steps.resume.outputs.RESULT == 'clean'
        run: $TOOLS/gate.sh

      - name: publish
        if: always() && steps.detect.outputs.DECISION == 'run'
        continue-on-error: true  # keep scheduled runs green; the status issue is the notification channel
        env:
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: $TOOLS/publish.sh
